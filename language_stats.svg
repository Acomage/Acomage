<rect x="140" y="55" width="280" height="12"
      rx="6" fill="#eaeef2"/>

<rect x="140" y="55" width="140.56385264594175" height="12"
      rx="6" fill="#2da44e"/>

<text x="430" y="65"
      class="percent">50.20%</text>

<text x="20" y="97" class="label">Lean</text>

<rect x="140" y="87" width="280" height="12"
      rx="6" fill="#eaeef2"/>

<rect x="140" y="87" width="49.15961939415064" height="12"
      rx="6" fill="#2da44e"/>

<text x="430" y="97"
      class="percent">17.56%</text>

<text x="20" y="129" class="label">Python</text>

<rect x="140" y="119" width="280" height="12"
