      rx="6" fill="#2da44e"/>

<text x="430" y="161"
      class="percent">4.91%</text>

<text x="20" y="193" class="label">JavaScript</text>

<rect x="140" y="183" width="280" height="12"
      rx="6" fill="#eaeef2"/>

<rect x="140" y="183" width="10.216593377866285" height="12"
